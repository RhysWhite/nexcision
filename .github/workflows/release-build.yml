name: Release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to validate, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Validate release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install source checkout and run tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v

      - name: Verify tag and release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          checked_out_commit=$(git rev-parse HEAD)
          tagged_commit=$(git rev-parse "$RELEASE_TAG^{commit}")

          if [[ "$checked_out_commit" != "$tagged_commit" ]]; then
            echo "Checked-out commit $checked_out_commit does not match $RELEASE_TAG ($tagged_commit)." >&2
            exit 1
          fi

          python - "$RELEASE_TAG" <<'PY'
          import pathlib
          import re
          import sys

          tag = sys.argv[1]

          pyproject = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          citation = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")
          version_text = pathlib.Path("src/nexcision/_version.py").read_text(
              encoding="utf-8"
          )
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          pyproject_version = re.search(
              r'^version\s*=\s*"([^"]+)"\s*$',
              pyproject,
              flags=re.MULTILINE,
          ).group(1)

          citation_version = re.search(
              r'^version:\s*"?([^"\s]+)"?\s*$',
              citation,
              flags=re.MULTILINE,
          ).group(1)

          package_version = re.search(
              r'^VERSION\s*=\s*"([^"]+)"\s*$',
              version_text,
              flags=re.MULTILINE,
          ).group(1)

          versions = {
              pyproject_version,
              citation_version,
              package_version,
          }

          assert len(versions) == 1, (
              "Release metadata versions disagree: "
              f"pyproject={pyproject_version}, "
              f"citation={citation_version}, "
              f"package={package_version}"
          )

          expected_tag = f"v{package_version}"
          assert tag == expected_tag, (
              f"Tag {tag!r} does not match expected tag {expected_tag!r}"
          )

          assert re.search(
              rf"^##\s+{re.escape(package_version)}(?:\s|$)",
              changelog,
              flags=re.MULTILINE,
          ), f"CHANGELOG.md has no release section for {package_version}"

          print(f"Release metadata validated for {tag}.")
          PY

      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Install and validate wheel
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          env_dir="$RUNNER_TEMP/nexcision-wheel"
          example_dir="$RUNNER_TEMP/nexcision-wheel-example"

          python -m venv "$env_dir"
          "$env_dir/bin/python" -m pip install dist/*.whl

          test "$("$env_dir/bin/nexcise" --version)" = "NEXCISION ${RELEASE_TAG#v}"

          cd /tmp
          PYTHONDONTWRITEBYTECODE=1 \
            "$env_dir/bin/python" \
            -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -v

          mkdir "$example_dir"
          cd "$example_dir"

          "$env_dir/bin/nexcise" \
            "$GITHUB_WORKSPACE/examples/input.nex" \
            "$GITHUB_WORKSPACE/examples/regions.tsv" \
            --output filtered.nex \
            --counts removed_counts_per_region.tsv \
            --report nexcision_report.json

          cmp "$GITHUB_WORKSPACE/examples/expected_filtered.nex" filtered.nex
          cmp \
            "$GITHUB_WORKSPACE/examples/expected_removed_counts_per_region.tsv" \
            removed_counts_per_region.tsv

          "$env_dir/bin/python" -m pip check

      - name: Install and validate source distribution
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          env_dir="$RUNNER_TEMP/nexcision-sdist"
          example_dir="$RUNNER_TEMP/nexcision-sdist-example"

          python -m venv "$env_dir"
          "$env_dir/bin/python" -m pip install dist/*.tar.gz

          test "$("$env_dir/bin/nexcise" --version)" = "NEXCISION ${RELEASE_TAG#v}"

          cd /tmp
          PYTHONDONTWRITEBYTECODE=1 \
            "$env_dir/bin/python" \
            -m unittest discover \
            -s "$GITHUB_WORKSPACE/tests" \
            -v

          mkdir "$example_dir"
          cd "$example_dir"

          "$env_dir/bin/nexcise" \
            "$GITHUB_WORKSPACE/examples/input.nex" \
            "$GITHUB_WORKSPACE/examples/regions.tsv" \
            --output filtered.nex \
            --counts removed_counts_per_region.tsv \
            --report nexcision_report.json

          cmp "$GITHUB_WORKSPACE/examples/expected_filtered.nex" filtered.nex
          cmp \
            "$GITHUB_WORKSPACE/examples/expected_removed_counts_per_region.tsv" \
            removed_counts_per_region.tsv

          "$env_dir/bin/python" -m pip check

      - name: Stage release documentation
        run: |
          cp CITATION.cff dist/
          cp CHANGELOG.md dist/
          cp LICENSE dist/

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: nexcision-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}-release-files
          path: dist/*
          if-no-files-found: error
