name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          checked_out_commit=$(git rev-parse HEAD)
          tagged_commit=$(git rev-parse "$RELEASE_TAG^{commit}")

          if [[ "$checked_out_commit" != "$tagged_commit" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG." >&2
            exit 1
          fi

          python - "$RELEASE_TAG" <<'PY'
          import pathlib
          import re
          import sys

          tag = sys.argv[1]

          pyproject = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          citation = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")
          version_text = pathlib.Path("src/nexcision/_version.py").read_text(
              encoding="utf-8"
          )
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          pyproject_version = re.search(
              r'^version\s*=\s*"([^"]+)"\s*$',
              pyproject,
              flags=re.MULTILINE,
          ).group(1)

          citation_version = re.search(
              r'^version:\s*"?([^"\s]+)"?\s*$',
              citation,
              flags=re.MULTILINE,
          ).group(1)

          package_version = re.search(
              r'^VERSION\s*=\s*"([^"]+)"\s*$',
              version_text,
              flags=re.MULTILINE,
          ).group(1)

          versions = {
              pyproject_version,
              citation_version,
              package_version,
          }

          assert len(versions) == 1, (
              "Release metadata versions disagree: "
              f"pyproject={pyproject_version}, "
              f"citation={citation_version}, "
              f"package={package_version}"
          )

          expected_tag = f"v{package_version}"
          assert tag == expected_tag, (
              f"Tag {tag!r} does not match expected tag {expected_tag!r}"
          )

          assert re.search(
              rf"^##\s+{re.escape(package_version)}(?:\s|$)",
              changelog,
              flags=re.MULTILINE,
          ), f"CHANGELOG.md has no release section for {package_version}"

          print(f"Release metadata validated for {tag}.")
          PY

      - name: Run source tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions for publishing
        uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
